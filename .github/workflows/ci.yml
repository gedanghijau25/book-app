name: DevOps CI Pipeline

on:
  push:
    branches:
      - main
      - devops-mid-assignment

  pull_request:
    branches:
      - main


env:
  REGISTRY: ghcr.io


jobs:

  # ==========================
  # Stage 1 - Lint
  # ==========================
  lint:

    name: Lint Frontend
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci


      - name: Run ESLint
        working-directory: frontend
        run: npm run lint



  # ==========================
  # Stage 2 - Build Docker Image
  # ==========================
  build:

    name: Build Docker Images
    needs: lint

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Build Backend Image
        run: |
          docker build \
          -t book-backend:${{ github.sha }} \
          ./backend


      - name: Build Frontend Image
        run: |
          docker build \
          -t book-frontend:${{ github.sha }} \
          ./frontend



  # ==========================
  # Stage 3 - Test
  # ==========================
  test:

    name: Application Test
    needs: build

    runs-on: ubuntu-latest


    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11


      - name: Install Backend Dependencies
        run: |
          pip install -r backend/requirements.txt


      - name: Backend Syntax Check
        run: |
          python -m py_compile backend/app.py



      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Frontend Build Test
        working-directory: frontend
        run: |
          npm ci
          npm run build




  # ==========================
  # Stage 4 - Push Docker Image
  # ==========================
  push:

    name: Push Image to GHCR
    needs: test

    if: github.event_name == 'push'

    runs-on: ubuntu-latest


    permissions:
      contents: read
      packages: write


    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4



      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}



      - name: Build Backend Image

        run: |
          docker build \
          -t ghcr.io/${{ github.repository }}/book-backend:${{ github.sha }} \
          ./backend



      - name: Push Backend Image

        run: |
          docker push \
          ghcr.io/${{ github.repository }}/book-backend:${{ github.sha }}




      - name: Build Frontend Image

        run: |
          docker build \
          -t ghcr.io/${{ github.repository }}/book-frontend:${{ github.sha }} \
          ./frontend



      - name: Push Frontend Image

        run: |
          docker push \
          ghcr.io/${{ github.repository }}/book-frontend:${{ github.sha }}



      - name: Push Latest Tags

        run: |

          docker tag \
          ghcr.io/${{ github.repository }}/book-backend:${{ github.sha }} \
          ghcr.io/${{ github.repository }}/book-backend:latest


          docker tag \
          ghcr.io/${{ github.repository }}/book-frontend:${{ github.sha }} \
          ghcr.io/${{ github.repository }}/book-frontend:latest


          docker push \
          ghcr.io/${{ github.repository }}/book-backend:latest


          docker push \
          ghcr.io/${{ github.repository }}/book-frontend:latest
